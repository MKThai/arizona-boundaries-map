version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: az-boundaries-db
    environment:
      POSTGRES_USER: azuser
      POSTGRES_PASSWORD: azpass
      POSTGRES_DB: arizona_boundaries
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
