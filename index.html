<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arizona Boundaries Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map centered on Arizona
        const map = L.map('map').setView([34.05, -112.09], 7);

        // Base map (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Layer groups
        const countyLayer = L.layerGroup().addTo(map);
        const cityLayer = L.layerGroup().addTo(map);
        const tribalLayer = L.layerGroup().addTo(map);

        // === COUNTIES ===
        fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
            .then(response => response.json())
            .then(data => {
                const azCounties = {
                    type: "FeatureCollection",
                    features: data.features.filter(f => f.properties.STATE === "04")
                };

                L.geoJSON(azCounties, {
                    style: { color: "#3388ff", weight: 3, fillOpacity: 0.15 },
                    onEachFeature: (feature, layer) => {
                        if (feature.properties.NAME) {
                            const name = feature.properties.NAME;
                            const area = Number(feature.properties.CENSUSAREA || 0);
                            layer.bindPopup(`<b>${name} County</b><br>Area: ${Math.round(area).toLocaleString()} sq mi`);
                        }
                    }
                }).addTo(countyLayer);
            })
            .catch(err => console.error('Error loading counties:', err));

        // === CITIES & TOWNS (Dynamic from GeoNames) ===
        // To use: Sign up for free at https://www.geonames.org/ (get a username)
        // Replace 'demo' below with your username for production use.
        // Free limit: ~10,000 requests/day. This fetches ~1000+ populated places in AZ.
        const geonamesUsername = 'luuthai'; // <-- CHANGE THIS to your GeoNames username

        fetch(`https://api.geonames.org/searchJSON?country=US&adminCode1=AZ&featureClass=P&maxRows=1000&username=${geonamesUsername}`)
            .then(response => response.json())
            .then(data => {
                if (data.geonames) {
                    data.geonames.forEach(place => {
                        const marker = L.circleMarker([place.lat, place.lng], {
                            radius: 6,
                            fillColor: "#ff6600",
                            color: "#fff",
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.85
                        }).bindPopup(`
                            <b>${place.name}</b><br>
                            ${place.adminName2 ? place.adminName2 + ', ' : ''}AZ<br>
                            Population: <strong>${place.population ? place.population.toLocaleString() : 'N/A'}</strong><br>
                            <small>GeoNames ID: ${place.geonameId}</small>
                        `);
                        marker.addTo(cityLayer);
                    });
                    console.log(`✅ Loaded ${data.geonames.length} cities from GeoNames`);
                } else {
                    console.error('No cities found in GeoNames response', data);
                }
            })
            .catch(err => {
                console.error('Error loading cities from GeoNames:', err);
                // Fallback to a few major cities if API fails
                const fallbackCities = [
                    {name: "Phoenix", lat: 33.4484, lng: -112.0740},
                    {name: "Tucson", lat: 32.2226, lng: -110.9747},
                    {name: "Mesa", lat: 33.4152, lng: -111.8315}
                ];
                fallbackCities.forEach(city => {
                    L.circleMarker([city.lat, city.lng], {
                        radius: 6, fillColor: "#ff6600", color: "#fff", weight: 1.5, fillOpacity: 0.85
                    }).bindPopup(`<b>${city.name}</b><br><small>(Fallback - GeoNames unavailable)</small>`).addTo(cityLayer);
                });
            });

        // Layer control
        const overlayMaps = {
            "Counties": countyLayer,
            "Cities & Towns": cityLayer,
            "Tribal Reservations": tribalLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

        console.log("✅ Arizona map initialized with dynamic GeoNames cities!");
    </script>
</body>
</html>
