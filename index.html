<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arizona Boundaries Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map centered on Arizona
        const map = L.map('map').setView([34.05, -112.09], 7);

        // Base map (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Layer groups
        const countyLayer = L.layerGroup().addTo(map);
        const cityLayer = L.layerGroup().addTo(map);
        const tribalLayer = L.layerGroup().addTo(map);

        // === COUNTIES ===
        fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
            .then(response => response.json())
            .then(data => {
                const azCounties = {
                    type: "FeatureCollection",
                    features: data.features.filter(f => f.properties.STATE === "04")
                };

                L.geoJSON(azCounties, {
                    style: { color: "#3388ff", weight: 3, fillOpacity: 0.15 },
                    onEachFeature: (feature, layer) => {
                        if (feature.properties.NAME) {
                            const name = feature.properties.NAME;
                            const area = Number(feature.properties.CENSUSAREA || 0);
                            layer.bindPopup(`<b>${name} County</b><br>Area: ${Math.round(area).toLocaleString()} sq mi`);
                        }
                    }
                }).addTo(countyLayer);
            })
            .catch(err => console.error('Error loading counties:', err));

        // === CITIES & TOWNS ===
        const majorCities = [
            {name: "Phoenix", lat: 33.4484, lng: -112.0740, pop: 4787790},
            {name: "Tucson", lat: 32.2226, lng: -110.9747, pop: 1093761},
            {name: "Mesa", lat: 33.4152, lng: -111.8315, pop: 515000},
            {name: "Chandler", lat: 33.3062, lng: -111.8413, pop: 280000},
            {name: "Scottsdale", lat: 33.4942, lng: -111.9261, pop: 245000},
            {name: "Gilbert", lat: 33.3528, lng: -111.7890, pop: 275000},
            {name: "Glendale", lat: 33.5387, lng: -112.1859, pop: 250000},
            {name: "Tempe", lat: 33.4255, lng: -111.9400, pop: 200000},
            {name: "Peoria", lat: 33.5809, lng: -112.2374, pop: 195000},
            {name: "Surprise", lat: 33.6306, lng: -112.3332, pop: 155000},
            {name: "Yuma", lat: 32.6927, lng: -114.6277, pop: 222125},
            {name: "Flagstaff", lat: 35.1983, lng: -111.6513, pop: 149453},
            {name: "Prescott", lat: 34.5400, lng: -112.4685, pop: 253595},
            {name: "Buckeye", lat: 33.3703, lng: -112.5838, pop: 119317},
            {name: "Lake Havasu City", lat: 34.4839, lng: -114.3225, pop: 58000},
            {name: "Casa Grande", lat: 32.8795, lng: -111.7570, pop: 69405},
            {name: "Sierra Vista", lat: 31.5455, lng: -110.2773, pop: 45838},
            {name: "Kingman", lat: 35.1894, lng: -114.0530, pop: 36080}
        ];

        majorCities.forEach(city => {
            const marker = L.circleMarker([city.lat, city.lng], {
                radius: 8,
                fillColor: "#ff6600",
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).bindPopup(`<b>${city.name}</b><br>Population: <strong>${city.pop.toLocaleString()}</strong> (2025 est.)`);
            marker.addTo(cityLayer);
        });

        // Layer control
        const overlayMaps = {
            "Counties": countyLayer,
            "Cities & Towns": cityLayer,
            "Tribal Reservations": tribalLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

        console.log("✅ Arizona map with cities loaded!");
    </script>
</body>
</html>
